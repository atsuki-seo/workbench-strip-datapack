name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true のときは生成物を artifact に残すだけで、Release は作らない"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      WORKBENCH_FETCH_CACHE: ${{ github.workspace }}/.fetch-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require the tagged commit to be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Extract release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md に ## [$version] の節がない、または空"
            exit 1
          fi

      - run: python3 tools/generate.py --all
      - run: python3 tools/check_static.py --all
      - run: python3 tools/check_vanilla.py --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write SHA256SUMS.txt
        run: |
          cd dist
          sha256sum -- *.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            release-notes.md
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # タグの push のとき、または dry_run を false にしてタグを指定した手動実行のときだけ Release を作る
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      # 下書きで作り、添付をすべて付けてから公開する(immutable releases を有効にしていても、公開前なら直せる)
      - name: Create draft release, attach files, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file release-notes.md
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false
