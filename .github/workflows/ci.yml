name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    name: targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          ids = sorted(p.stem for p in pathlib.Path("targets").glob("*.json"))
          print("matrix=" + json.dumps({"target": ids}))
          EOF

  check:
    name: check (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      WORKBENCH_FETCH_CACHE: ${{ github.workspace }}/.fetch-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # mcmeta の取得先はコミットSHAで固定されているので、内容は変わらない。キーにはそのSHAを持つターゲット設定のハッシュを使う
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetch-cache
          key: mcmeta-${{ matrix.target }}-${{ hashFiles(format('targets/{0}.json', matrix.target)) }}
      - run: python3 tools/generate.py --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: python3 tools/check_static.py --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: python3 tools/check_vanilla.py --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          # GitHub API の呼び出しだけを認証付きにする(レート制限対策)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-email:
    name: commit-email
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 公開リポジトリに会社のアドレスなどが入らないよう、PR のコミットの author / committer を確かめる。
      # 許可するのは、@users.noreply.github.com で終わるアドレスと、GitHub のウェブ操作が committer に使う noreply@github.com(Dependabot のコミットなど)
      - name: Check commit email addresses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%H %ae %ce' "$BASE_SHA..$HEAD_SHA" | awk '
            function ok(a) { return a ~ /@users\.noreply\.github\.com$/ || a == "noreply@github.com" }
            !ok($2) || !ok($3) { print $1 }
          ')
          if [ -n "$bad" ]; then
            echo "::error::noreply アドレス以外のメールアドレスを持つコミットがある:"
            echo "$bad"
            exit 1
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [targets, check, commit-email]
    runs-on: ubuntu-latest
    steps:
      # commit-email は PR のときだけ走るので skipped を許し、それ以外が success でなければ失敗にする
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::失敗したジョブがある: $RESULTS"; exit 1 ;;
            esac
          done
